name: CI

on:
  pull_request:
  push:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apecam
          POSTGRES_PASSWORD: apecam
          POSTGRES_DB: apecam
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apecam" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://apecam:apecam@localhost:5432/apecam
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the secret scan also covers old commits
      # The repository is public: fail on any committed secret (S4-7, threat model §12).
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on new high/critical advisories in production dependencies (S4-7).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      # E2E (S4-5) against the production build and a throwaway seeded PGlite database.
      - run: pnpm --filter @apecam/web exec playwright install --with-deps chromium
      - name: Session key for the E2E server
        run: node apps/web/scripts/gen-session-key.mjs | tr -d '"' >> "$GITHUB_ENV"
      - run: pnpm --filter @apecam/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
