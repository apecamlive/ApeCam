services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apecam
      POSTGRES_PASSWORD: apecam
      POSTGRES_DB: apecam
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
volumes:
  pgdata:
